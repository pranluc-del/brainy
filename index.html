<style>
/* Layout: one centred column of cards; two chapter colours (Uvod = lapis, Prapovijest = earth) carry meaning throughout */
:root {
  --bg: #F4F1FF;
  --bg2: #FFF3EA;
  --card: #FFFFFF;
  --ink: #1E1B3A;
  --muted: #5E5A7A;
  --line: #DDD8F0;
  --accent: #6A44F2;
  --accent-ink: #FFFFFF;
  --gold: #C25A0A;
  --gold-soft: #FFEEDD;
  --hero1: #6A44F2;
  --hero2: #C03FD0;
  --sun: #FFCB3D;
  --uvod: #2F4FA8;
  --uvod-soft: #E2E8F8;
  --pra: #8E5426;
  --pra-soft: #F5E7DA;
  --istok: #17766B;
  --istok-soft: #DCF1EE;
  --gz: #1F6FB2; --gz-soft: #DDEBF7; --gk: #6D4C9F; --gk-soft: #EAE2F5; --gv: #A35A00; --gv-soft: #F8E8D2; --gm: #3B6E1E; --gm-soft: #E3F0D9; --go: #C0392B; --go-soft: #F9E0DD; --vz: #1565C0; --vz-soft: #DCE9F8; --vs: #00838F; --vs-soft: #D6F0F2; --mj: #7B1FA2; --mj-soft: #EEDDF4; --mz: #AD1457; --mz-soft: #F8DCE7;
  --ra: #0E7C86; --ra-soft: #D9F0F2; --sk: #3D5AA8; --sk-soft: #E0E6F6; --bi: #2E7D32; --bi-soft: #E0F1E1; --je: #B5482B; --je-soft: #F8E3DC; --na: #8A5A00; --na-soft: #F6EBD4;
  --su: #7B3F9E;
  --su-soft: #EFE3F6;
  --f1: #1F6FB2;
  --f1-soft: #DDEBF7;
  --f2: #B32D6A;
  --f2-soft: #F8E1EC;
  --ok: #23824A;
  --ok-soft: #DFF3E6;
  --bad: #C0392F;
  --bad-soft: #FBE3E1;
  --warn: #B07A12;
  --display: "Baloo 2", "Trebuchet MS", system-ui, sans-serif;
  --body: "Nunito", "Segoe UI", system-ui, sans-serif;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #15132A; --bg2: #1C1426; --card: #211E3C; --ink: #EFEDFA; --muted: #ABA6C8; --line: #37325C;
    --accent: #A890FF; --accent-ink: #15132A; --gold: #FFA45C; --gold-soft: #3D2616; --hero1: #4A2FC4; --hero2: #8A2A99; --sun: #FFCB3D;
    --uvod: #8FA7F2; --uvod-soft: #1F2A4A; --pra: #E0A271; --pra-soft: #3A2718; --istok: #5FCDBD; --istok-soft: #15332F; --su: #CDA2EA; --su-soft: #33223F; --f1: #8CC2F0; --f1-soft: #172C40; --f2: #F296BF; --f2-soft: #3D1A2A; --gz: #8EC3F0; --gz-soft: #15293D; --gk: #C3A6F0; --gk-soft: #2A2040; --gv: #F0B970; --gv-soft: #3A2A12; --gm: #A8D98A; --gm-soft: #1C2E12; --go: #F29A90; --go-soft: #3D1B18; --vz: #90BFF5; --vz-soft: #14263D; --vs: #73D3DD; --vs-soft: #0F3236; --mj: #D29BEA; --mj-soft: #2E1838; --mz: #F08CB4; --mz-soft: #3A1526; --ra: #6FD3DC; --ra-soft: #12363A; --sk: #9DB2F2; --sk-soft: #1E2744; --bi: #8FD694; --bi-soft: #173019; --je: #F2A48C; --je-soft: #3D2018; --na: #E8C27A; --na-soft: #36290F;
    --ok: #5CCF8B; --ok-soft: #173826; --bad: #FF8B80; --bad-soft: #401E1C; --warn: #E9B44C;
    color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --bg: #15132A; --bg2: #1C1426; --card: #211E3C; --ink: #EFEDFA; --muted: #ABA6C8; --line: #37325C;
  --accent: #A890FF; --accent-ink: #15132A; --gold: #FFA45C; --gold-soft: #3D2616; --hero1: #4A2FC4; --hero2: #8A2A99; --sun: #FFCB3D;
  --uvod: #8FA7F2; --uvod-soft: #1F2A4A; --pra: #E0A271; --pra-soft: #3A2718; --istok: #5FCDBD; --istok-soft: #15332F; --su: #CDA2EA; --su-soft: #33223F; --f1: #8CC2F0; --f1-soft: #172C40; --f2: #F296BF; --f2-soft: #3D1A2A; --gz: #8EC3F0; --gz-soft: #15293D; --gk: #C3A6F0; --gk-soft: #2A2040; --gv: #F0B970; --gv-soft: #3A2A12; --gm: #A8D98A; --gm-soft: #1C2E12; --go: #F29A90; --go-soft: #3D1B18; --vz: #90BFF5; --vz-soft: #14263D; --vs: #73D3DD; --vs-soft: #0F3236; --mj: #D29BEA; --mj-soft: #2E1838; --mz: #F08CB4; --mz-soft: #3A1526; --ra: #6FD3DC; --ra-soft: #12363A; --sk: #9DB2F2; --sk-soft: #1E2744; --bi: #8FD694; --bi-soft: #173019; --je: #F2A48C; --je-soft: #3D2018; --na: #E8C27A; --na-soft: #36290F;
  --ok: #5CCF8B; --ok-soft: #173826; --bad: #FF8B80; --bad-soft: #401E1C; --warn: #E9B44C;
  color-scheme: dark;
}
* { box-sizing: border-box; }
body {
  background: linear-gradient(170deg, var(--bg) 0%, var(--bg2) 100%); background-color: var(--bg); color: var(--ink); min-height: 100vh;
  font-family: var(--body); font-size: 18px; line-height: 1.5;
  padding-left: max(16px, env(safe-area-inset-left, 0px));
  padding-right: max(16px, env(safe-area-inset-right, 0px));
  padding-block: 20px 48px;
}
main { max-width: 660px; margin: 0 auto; display: grid; gap: 16px; }
h1, h2, h3 { font-family: var(--display); line-height: 1.15; margin: 0; text-wrap: balance; }
h1 { font-size: clamp(2rem, 7vw, 2.6rem); font-weight: 800; }
h2 { font-size: 1.45rem; font-weight: 800; }
h3 { font-size: 1.15rem; font-weight: 800; }
p { margin: 0; }
.card {
  background: var(--card); border-radius: 22px; padding: 20px;
  box-shadow: 0 2px 0 var(--line), 0 10px 30px -20px rgba(29, 34, 50, .4);
  display: grid; gap: 14px; min-width: 0;
}
.eyebrow { font-weight: 800; font-size: .78rem; letter-spacing: .1em; text-transform: uppercase; color: var(--muted); }
.muted { color: var(--muted); }
.small { font-size: .9rem; }
button { font: inherit; cursor: pointer; color: inherit; }
button:focus-visible, input:focus-visible, summary:focus-visible { outline: 3px solid var(--accent); outline-offset: 3px; }
.btn {
  border: 0; border-radius: 16px; padding: 12px 20px; min-height: 54px;
  background: var(--accent); color: var(--accent-ink);
  font-family: var(--display); font-weight: 800; font-size: 1.2rem;
  box-shadow: 0 4px 0 color-mix(in srgb, var(--accent) 55%, #000);
  transition: transform .08s;
}
.btn:active { transform: translateY(3px); box-shadow: 0 1px 0 color-mix(in srgb, var(--accent) 55%, #000); }
.btn.ghost { background: transparent; color: var(--accent); box-shadow: inset 0 0 0 2px var(--accent); }
.btn.gold { background: var(--gold); color: var(--accent-ink); box-shadow: 0 4px 0 color-mix(in srgb, var(--gold) 55%, #000); }
.btn[disabled] { opacity: .45; cursor: default; }
.row { display: flex; gap: 10px; flex-wrap: wrap; align-items: center; }
.row > .btn { flex: 1 1 180px; }

/* header stats */
.stats { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 10px; }
.stat { background: var(--gold-soft); border-radius: 16px; padding: 10px 12px; display: grid; gap: 0; }
.stat b { font-family: var(--display); font-size: 1.6rem; line-height: 1.1; color: var(--gold); font-variant-numeric: tabular-nums; }
.stat span { font-size: .85rem; color: var(--ink); }

/* chapters */
.chapters { display: grid; gap: 10px; }
.chap { border-radius: 16px; padding: 14px; display: grid; gap: 8px; border: 0; text-align: left; background: var(--uvod-soft); }
.chap.pra { background: var(--pra-soft); }
.chap.sel { box-shadow: inset 0 0 0 3px var(--uvod); }
.chap.pra.sel { box-shadow: inset 0 0 0 3px var(--pra); }
.chap.istok { background: var(--istok-soft); }
.chap.istok.sel { box-shadow: inset 0 0 0 3px var(--istok); }
.chap.istok h3 { color: var(--istok); }
.tag.istok { background: var(--istok-soft); color: var(--istok); }
.flash.istok { background: var(--istok-soft); }
.chap-top { display: flex; justify-content: space-between; gap: 10px; align-items: baseline; flex-wrap: wrap; }
.chap h3 { color: var(--uvod); }
.chap.pra h3 { color: var(--pra); }
.bar { height: 12px; background: color-mix(in srgb, var(--ink) 12%, transparent); border-radius: 99px; overflow: hidden; }
.bar i { display: block; height: 100%; border-radius: 99px; background: var(--bad); transition: width .4s; }
.bar i.mid { background: var(--warn); }
.bar i.hi { background: var(--ok); }
.pct { font-family: var(--display); font-weight: 800; font-variant-numeric: tabular-nums; }
.chip-all { justify-self: start; border: 0; background: transparent; color: var(--accent); font-weight: 800; padding: 4px 0; text-decoration: underline; text-underline-offset: 3px; }

/* badges */
.badges { display: grid; grid-template-columns: repeat(auto-fill, minmax(130px, 1fr)); gap: 8px; }
.badge { border-radius: 14px; padding: 10px; display: grid; gap: 4px; justify-items: center; text-align: center; background: color-mix(in srgb, var(--ink) 6%, transparent); color: var(--muted); font-size: .85rem; font-weight: 700; }
.badge svg { width: 36px; height: 36px; }
.badge.on { background: var(--gold-soft); color: var(--ink); }
.badge.on svg { color: var(--gold); }

/* quiz */
.top { display: flex; align-items: center; justify-content: space-between; gap: 12px; flex-wrap: wrap; }
.count { font-family: var(--display); font-weight: 800; font-size: 1.1rem; font-variant-numeric: tabular-nums; }
.pill { font-weight: 800; border-radius: 999px; padding: 4px 12px; font-variant-numeric: tabular-nums; background: var(--gold-soft); color: var(--gold); }
.pill.timer { background: var(--uvod-soft); color: var(--uvod); }
.pts { display: grid; gap: 8px; margin: 12px 0; }
.pt { display: flex; gap: 10px; align-items: flex-start; text-align: left; border: 2px solid var(--line); background: transparent; color: var(--ink); border-radius: 14px; padding: 10px 12px; font: inherit; }
.pt .box { flex: 0 0 22px; height: 22px; border-radius: 7px; border: 2px solid var(--line); display: grid; place-items: center; font-weight: 900; color: var(--accent-ink); }
.pt.on { border-color: var(--ok); background: var(--ok-soft); }
.pt.on .box { background: var(--ok); border-color: var(--ok); }
.namefield { width: 100%; font: inherit; font-size: 1.1rem; padding: 12px 14px; border-radius: 14px; border: 2px solid var(--line); background: var(--bg); color: var(--ink); margin: 8px 0 12px; }
.tasks { display: grid; gap: 8px; margin-top: 10px; }
.task { display: flex; gap: 10px; align-items: center; border: 2px solid var(--line); border-radius: 14px; padding: 10px 12px; background: transparent; color: var(--ink); font: inherit; text-align: left; width: 100%; }
.task .box { flex: 0 0 24px; height: 24px; border-radius: 50%; border: 2px solid var(--line); display: grid; place-items: center; font-weight: 900; color: var(--accent-ink); font-size: .85rem; }
.task.done { border-color: var(--ok); background: var(--ok-soft); }
.task.done .box { background: var(--ok); border-color: var(--ok); }
.task .go { margin-left: auto; color: var(--accent); font-weight: 800; white-space: nowrap; }
.report { white-space: pre-wrap; background: var(--bg); border-radius: 14px; padding: 12px; font-size: .9rem; margin: 8px 0; }
textarea.namefield { min-height: 90px; font-size: .85rem; font-family: ui-monospace, monospace; word-break: break-all; }
.subjects { display: grid; grid-template-columns: repeat(auto-fill, minmax(150px, 1fr)); gap: 12px; }
.subj { position: relative; border: 0; border-radius: 20px; padding: 16px; display: grid; gap: 6px; align-content: start; text-align: left; color: var(--ink); font: inherit; min-height: 150px; }
.subj .sico { width: 52px; height: 52px; border-radius: 16px; display: grid; place-items: center; }
.subj .sico svg { width: 30px; height: 30px; }
.subj h3 { font-size: 1.3rem; }
.subj .book { font-size: .8rem; color: var(--muted); }
.subj .bar { height: 8px; margin-top: 4px; }
.subj .due { font-size: .8rem; font-weight: 800; }
.subj.on { box-shadow: 0 4px 0 color-mix(in srgb, var(--ink) 14%, transparent); }
.subj.on:active { transform: translateY(3px); box-shadow: 0 1px 0 color-mix(in srgb, var(--ink) 14%, transparent); }
.subj.off { background: color-mix(in srgb, var(--ink) 5%, transparent); cursor: default; }
.subj.off .sico { background: color-mix(in srgb, var(--ink) 8%, transparent); color: var(--muted); }
.subj.off h3 { color: var(--muted); }
.subj .soon { position: absolute; top: 12px; right: 12px; font-size: .7rem; font-weight: 800; text-transform: uppercase; letter-spacing: .05em; background: var(--card); color: var(--muted); border-radius: 99px; padding: 2px 8px; }
.subj.povijest { background: var(--pra-soft); } .subj.povijest .sico { background: var(--pra); color: var(--card); } .subj.povijest h3 { color: var(--pra); }
.back { justify-self: start; border: 0; background: transparent; color: var(--accent); font-weight: 800; padding: 4px 0; display: inline-flex; gap: 4px; align-items: center; }
.tag.su { background: var(--su-soft); color: var(--su); } .tag.f1 { background: var(--f1-soft); color: var(--f1); } .tag.f2 { background: var(--f2-soft); color: var(--f2); }
.flash.su .face { background: var(--su-soft); } .flash.f1 .face { background: var(--f1-soft); } .flash.f2 .face { background: var(--f2-soft); }
.station.su .val { stroke: var(--su); } .station.su .ico { background: var(--su-soft); color: var(--su); } .station.su h3 { color: var(--su); }
.station.f1 .val { stroke: var(--f1); } .station.f1 .ico { background: var(--f1-soft); color: var(--f1); } .station.f1 h3 { color: var(--f1); }
.station.f2 .val { stroke: var(--f2); } .station.f2 .ico { background: var(--f2-soft); color: var(--f2); } .station.f2 h3 { color: var(--f2); }
.subj.engleski { background: var(--f1-soft); } .subj.engleski .sico { background: var(--f1); color: var(--card); } .subj.engleski h3 { color: var(--f1); }
.listen { display: inline-flex; gap: 6px; align-items: center; border: 2px solid var(--accent); color: var(--accent); background: transparent; border-radius: 99px; padding: 6px 14px; font-weight: 800; }
.listen svg { width: 18px; height: 18px; }
.model { background: var(--bg); border-radius: 14px; padding: 12px 14px; font-size: .95rem; line-height: 1.55; }
.hero { background: linear-gradient(135deg, var(--hero1), var(--hero2)); color: #fff; box-shadow: 0 12px 30px -18px var(--hero1); position: relative; overflow: hidden; }
.hero::after { content: ""; position: absolute; width: 220px; height: 220px; border-radius: 50%; right: -70px; top: -90px; background: rgba(255,255,255,.12); pointer-events: none; }
.hero .eyebrow { color: rgba(255,255,255,.82); }
.hero .stat { background: rgba(255,255,255,.16); }
.hero .stat b { color: var(--sun); } .hero .stat span { color: #fff; }
.hero .level { background: rgba(255,255,255,.16); }
.hero .level .lv { background: #fff; color: var(--hero1); }
.hero .level small { color: rgba(255,255,255,.85); }
.hero .level .bar { background: rgba(255,255,255,.28); } .hero .level .bar i { background: var(--sun); }
.hero .sound { background: rgba(255,255,255,.2); color: #fff; position: relative; z-index: 1; }
.hero .back { color: #fff; }
.prog { display: flex; height: 16px; border-radius: 99px; overflow: hidden; background: color-mix(in srgb, var(--ink) 10%, transparent); }
.prog i { display: block; height: 100%; }
.prog .p1 { background: var(--ok); } .prog .p2 { background: var(--sun); }
.legend { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 8px; }
.legend div { display: grid; gap: 0; }
.legend b { font-family: var(--display); font-size: 1.5rem; line-height: 1.1; font-variant-numeric: tabular-nums; }
.legend span { font-size: .8rem; color: var(--muted); display: flex; gap: 5px; align-items: center; }
.legend span::before { content: ""; width: 10px; height: 10px; border-radius: 3px; background: var(--c); flex: none; }
.mz { flex: none; display: block; overflow: visible; }
.mz.idle { animation: bob 2.6s ease-in-out infinite; transform-origin: 50% 100%; }
.mz.jump { animation: jump .7s cubic-bezier(.3,1.6,.5,1) both; transform-origin: 50% 100%; }
.mz.droop { animation: droop .6s ease-out both; transform-origin: 50% 100%; }
@keyframes bob { 0%,100% { transform: translateY(0) rotate(-2deg); } 50% { transform: translateY(-5px) rotate(2deg); } }
@keyframes jump { 0% { transform: scale(.7) translateY(10px); } 50% { transform: scale(1.08) translateY(-14px); } 100% { transform: none; } }
@keyframes droop { 0% { transform: scale(1.05); } 100% { transform: none; } }
.buddy { display: flex; gap: 10px; align-items: center; }
.bubble { position: relative; background: var(--card); color: var(--ink); border-radius: 18px; padding: 10px 14px; font-weight: 800; line-height: 1.35; box-shadow: 0 2px 0 var(--line); }
.bubble::before { content: ""; position: absolute; left: -8px; top: 50%; margin-top: -8px; border: 8px solid transparent; border-left: 0; border-right-color: var(--card); }
.card:not(.hero) .bubble { background: var(--bg); box-shadow: none; }
.card:not(.hero) .bubble::before { border-right-color: var(--bg); }
.fbhead { display: flex; gap: 10px; align-items: center; }
.pill.timer.low { background: var(--bad-soft); color: var(--bad); }
.dots { display: flex; gap: 6px; flex-wrap: wrap; }
.dot { width: 13px; height: 13px; border-radius: 50%; background: var(--line); }
.dot.now { background: var(--accent); transform: scale(1.2); }
.dot.ok { background: var(--ok); } .dot.bad { background: var(--bad); } .dot.done { background: var(--muted); }
.tag { justify-self: start; font-weight: 800; font-size: .8rem; letter-spacing: .06em; text-transform: uppercase; border-radius: 999px; padding: 3px 10px; background: var(--uvod-soft); color: var(--uvod); }
.tag.pra { background: var(--pra-soft); color: var(--pra); }
.q { font-size: 1.3rem; font-weight: 800; line-height: 1.35; }
.opts { display: grid; gap: 10px; }
.opt {
  text-align: left; border: 2px solid var(--line); background: var(--card); border-radius: 14px;
  padding: 12px 14px; min-height: 52px; font-weight: 600;
}
.opt:hover { border-color: var(--accent); }
.opt.pick { border-color: var(--accent); background: var(--uvod-soft); }
.opt.ok { border-color: var(--ok); background: var(--ok-soft); }
.opt.bad { border-color: var(--bad); background: var(--bad-soft); }
.opt[disabled] { cursor: default; }
input[type="text"] {
  font: inherit; font-size: 1.2rem; width: 100%; padding: 12px 14px; border-radius: 14px;
  border: 2px solid var(--line); background: var(--card); color: var(--ink);
}
input[type="text"]:focus { border-color: var(--accent); outline: none; }
.hint { font-size: .85rem; color: var(--muted); }
.seq { display: grid; gap: 8px; min-height: 54px; padding: 10px; border-radius: 14px; border: 2px dashed var(--line); }
.seq .opt { display: flex; gap: 10px; align-items: center; }
.seq .n { font-family: var(--display); font-weight: 800; color: var(--accent); min-width: 1.4em; }
.pool { display: grid; gap: 8px; }
.match { display: grid; grid-template-columns: minmax(0, 1fr) minmax(0, 1.4fr); gap: 8px; align-items: start; }
.match .col { display: grid; gap: 8px; }
.match .opt { font-size: .95rem; padding: 10px 12px; display: flex; gap: 8px; align-items: center; }
.match .opt .k { flex: none; width: 24px; height: 24px; border-radius: 50%; display: grid; place-items: center; font-size: .8rem; font-weight: 800; color: #fff; }
.feedback { border-radius: 16px; padding: 14px; display: grid; gap: 6px; }
.feedback.ok { background: var(--ok-soft); }
.feedback.bad { background: var(--bad-soft); }
.feedback h3 { font-size: 1.25rem; }
.feedback.ok h3 { color: var(--ok); } .feedback.bad h3 { color: var(--bad); }
.src { font-size: .85rem; color: var(--muted); }

/* flashcards */
.flash {
  border: 0; border-radius: 22px; min-height: 240px; padding: 24px; display: grid; place-items: center; text-align: center; gap: 10px;
  background: var(--uvod-soft); color: var(--ink);
}
.flash.pra { background: var(--pra-soft); }
.flash .term { font-family: var(--display); font-weight: 800; font-size: 2rem; line-height: 1.1; }
.flash .def { font-size: 1.15rem; font-weight: 600; }

/* results */
.big { font-family: var(--display); font-size: 3.2rem; font-weight: 800; line-height: 1; font-variant-numeric: tabular-nums; }
.grade { display: flex; gap: 16px; align-items: center; flex-wrap: wrap; }
.grade .mark { width: 88px; height: 88px; border-radius: 22px; display: grid; place-items: center; font-family: var(--display); font-size: 3rem; font-weight: 800; background: var(--gold-soft); color: var(--gold); }
.review { display: grid; gap: 8px; }
.rv { display: grid; grid-template-columns: 28px minmax(0, 1fr); gap: 8px; padding: 10px 0; border-top: 1px solid var(--line); font-size: .95rem; }
.rv .m { font-weight: 800; font-size: 1.1rem; }
.rv .m.ok { color: var(--ok); } .rv .m.bad { color: var(--bad); }
.rv.wide { grid-template-columns: 46px minmax(0, 1fr); } .rv.wide .m { font-size: .95rem; }

/* parents */
details.card > summary { cursor: pointer; font-family: var(--display); font-weight: 800; font-size: 1.15rem; list-style: none; }
details.card > summary::-webkit-details-marker { display: none; }
details.card > summary::after { content: " ▾"; color: var(--muted); }
table { width: 100%; border-collapse: collapse; font-size: .92rem; }
th, td { text-align: left; padding: 6px 4px; border-bottom: 1px solid var(--line); vertical-align: top; }
td.num, th.num { text-align: right; font-variant-numeric: tabular-nums; white-space: nowrap; }
.tablewrap { overflow-x: auto; }
@media (max-width: 460px) {
  .stats { gap: 6px; }
  .stat b { font-size: 1.35rem; }
  .match { grid-template-columns: minmax(0, 1fr); }
}
/* motion */
@keyframes rise { from { opacity: 0; transform: translateY(14px); } to { opacity: 1; transform: none; } }
main > section, main > details { animation: rise .38s cubic-bezier(.2,.8,.3,1) both; }
main > :nth-child(2) { animation-delay: .05s; } main > :nth-child(3) { animation-delay: .1s; } main > :nth-child(4) { animation-delay: .15s; } main > :nth-child(5) { animation-delay: .2s; } main > :nth-child(n+6) { animation-delay: .25s; }
.btn, .opt, .task, .chap, .pt, .station { transition: transform .12s, background-color .2s, border-color .2s, box-shadow .2s; }
.opt:active, .task:active, .pt:active, .station:active { transform: scale(.97); }
@keyframes pop { 0% { transform: scale(.6); opacity: 0; } 60% { transform: scale(1.15); opacity: 1; } 100% { transform: scale(1); } }
.pop { animation: pop .4s cubic-bezier(.2,.8,.3,1.4) both; }
.fx-layer { position: fixed; inset: 0; pointer-events: none; z-index: 50; overflow: hidden; }
.fx-bit { position: absolute; width: 10px; height: 14px; border-radius: 3px; }
.fx-float { position: absolute; font-family: var(--display); font-weight: 800; font-size: 1.6rem; color: var(--ok); text-shadow: 0 2px 0 var(--card); }
.combo { background: var(--bad-soft); color: var(--bad); }
.combo svg { width: 14px; height: 14px; vertical-align: -2px; margin-right: 3px; }

/* hero: level */
.hero-top { display: flex; justify-content: space-between; align-items: flex-start; gap: 10px; }
.sound { border: 0; background: color-mix(in srgb, var(--ink) 7%, transparent); color: var(--ink); width: 44px; height: 44px; border-radius: 50%; display: grid; place-items: center; flex: none; }
.sound svg { width: 22px; height: 22px; }
.sizes { display: flex; flex-wrap: wrap; align-items: center; gap: 8px; margin-top: 8px; }
.sizes .chip { border: 2px solid color-mix(in srgb, var(--ink) 15%, transparent); background: var(--card); color: var(--ink); border-radius: 999px; padding: 6px 14px; font: inherit; font-weight: 700; font-size: 14px; min-height: 36px; }
.sizes .chip.on { background: var(--accent); border-color: transparent; color: var(--accent-ink); }
.sound.lbl { width: auto; padding: 0 14px 0 12px; border-radius: 22px; display: flex; align-items: center; gap: 6px; font: inherit; font-weight: 700; font-size: 13px; white-space: nowrap; }
.level { display: grid; grid-template-columns: auto minmax(0, 1fr); gap: 4px 12px; align-items: center; background: var(--uvod-soft); border-radius: 16px; padding: 10px 14px; margin: 12px 0; }
.level .lv { grid-row: span 2; width: 48px; height: 48px; border-radius: 14px; background: var(--accent); color: var(--accent-ink); display: grid; place-items: center; font-family: var(--display); font-weight: 800; font-size: 1.5rem; }
.level b { font-family: var(--display); font-size: 1.1rem; }
.level .bar { height: 10px; }
.level .bar i { background: var(--accent); }
.level small { grid-column: 2; color: var(--muted); font-size: .8rem; }

/* timeline path */
.path { position: relative; display: grid; gap: 14px; padding-left: 0; margin-top: 8px; }
.path::before { content: ""; position: absolute; left: 35px; top: 30px; bottom: 30px; border-left: 4px dotted var(--line); }
.station { position: relative; display: grid; grid-template-columns: 74px minmax(0, 1fr); gap: 14px; align-items: center; border: 0; background: transparent; color: var(--ink); text-align: left; padding: 6px; border-radius: 18px; font: inherit; }
.station.sel { background: color-mix(in srgb, var(--ink) 6%, transparent); }
.ring { position: relative; width: 70px; height: 70px; }
.ring svg.r { position: absolute; inset: 0; transform: rotate(-90deg); }
.ring .r circle { fill: none; stroke-width: 7; }
.ring .r .trk { stroke: var(--line); }
.ring .r .val { stroke-linecap: round; transition: stroke-dashoffset 1s cubic-bezier(.2,.8,.3,1); }
.ring .ico { position: absolute; inset: 9px; border-radius: 50%; display: grid; place-items: center; }
.ring .ico svg { width: 30px; height: 30px; }
.station.uvod .val { stroke: var(--uvod); } .station.uvod .ico { background: var(--uvod-soft); color: var(--uvod); }
.station.pra .val { stroke: var(--pra); } .station.pra .ico { background: var(--pra-soft); color: var(--pra); }
.station.istok .val { stroke: var(--istok); } .station.istok .ico { background: var(--istok-soft); color: var(--istok); }
.station h3 { font-size: 1.15rem; }
.station.uvod h3 { color: var(--uvod); } .station.pra h3 { color: var(--pra); } .station.istok h3 { color: var(--istok); }
.station .meta { font-size: .85rem; color: var(--muted); }
.station .pct { font-size: 1.05rem; }
.here { display: inline-block; margin-left: 6px; font-size: .72rem; font-weight: 800; text-transform: uppercase; letter-spacing: .05em; background: var(--gold); color: var(--accent-ink); border-radius: 99px; padding: 1px 8px; vertical-align: 2px; }
.crown { position: absolute; top: -6px; right: -4px; width: 26px; height: 26px; border-radius: 50%; background: var(--gold); color: var(--accent-ink); display: grid; place-items: center; font-size: .8rem; font-weight: 900; }

/* flip cards */
.flash { background: transparent !important; perspective: 1200px; padding: 0; display: block; min-height: 250px; }
.flip { position: relative; display: grid; min-height: 250px; transition: transform .55s cubic-bezier(.2,.8,.3,1); transform-style: preserve-3d; }
.flash.flipped .flip { transform: rotateY(180deg); }
.face { grid-area: 1 / 1; backface-visibility: hidden; -webkit-backface-visibility: hidden; border-radius: 22px; padding: 24px; display: grid; place-items: center; align-content: center; gap: 10px; background: var(--uvod-soft); }
.face.back { transform: rotateY(180deg); }
.flash.pra .face { background: var(--pra-soft); } .flash.istok .face { background: var(--istok-soft); }
.face .tapme { font-size: .8rem; font-weight: 800; letter-spacing: .06em; text-transform: uppercase; color: var(--muted); }

/* stars */
.stars { display: flex; gap: 6px; margin: 6px 0; }
.stars svg { width: 44px; height: 44px; color: var(--line); }
.stars svg.on { color: var(--gold); }

/* level-up overlay */
.overlay { position: fixed; inset: 0; z-index: 40; display: grid; place-items: center; padding: 16px; background: color-mix(in srgb, var(--ink) 45%, transparent); }
.overlay .card { max-width: 380px; text-align: center; display: grid; gap: 10px; justify-items: center; }
.overlay .lv { width: 84px; height: 84px; border-radius: 24px; background: var(--accent); color: var(--accent-ink); display: grid; place-items: center; font-family: var(--display); font-weight: 800; font-size: 2.6rem; }

@media (prefers-reduced-motion: reduce) { *, *::before, *::after { transition: none !important; animation: none !important; } }
.steps { display: flex; gap: 6px; margin: 4px 0 2px; }
.steps i { flex: 1; height: 6px; border-radius: 99px; background: var(--line); }
.steps i.on { background: var(--accent); }
.story { font-size: 1.12rem; line-height: 1.7; background: var(--bg); border-radius: 14px; padding: 14px 16px; margin: 0; }
.cues { display: grid; gap: 6px; margin: 4px 0 0; padding: 0; list-style: none; }
.cues li { background: var(--bg); border-radius: 12px; padding: 8px 12px; font-weight: 700; }
.cues li b { color: var(--accent); margin-right: 6px; }
.rec[hidden] { display: none; }
.rec { display: inline-flex; gap: 8px; align-items: center; justify-content: center; border: 0; border-radius: 99px; padding: 14px 22px; font: inherit; font-weight: 900; color: #fff; background: #E0384B; }
.rec.on { animation: pulse 1s ease-in-out infinite; }
@keyframes pulse { 50% { transform: scale(1.05); box-shadow: 0 0 0 8px rgba(224,56,75,.18); } }
@media (prefers-reduced-motion: reduce) { .rec.on { animation: none; } }

  { id:'e21', ch:'f1', t:'mc', p:10, q:'Are Cathy and Mike in the same class?', a:['No, they aren\'t.','Yes, they are.'], ex:'Cathy and Mike are not in the same class, but they go to school together.' },

  { id:'e26', ch:'f1', t:'mc', p:11, q:'You ____ a baby. (niječno)', a:['aren\'t','isn\'t','am not','not'], ex:'You are not = You aren\'t.' },
  { id:'e27', ch:'f1', t:'mc', p:11, q:'It ____ big.', a:['is','are','am','have'], ex:'It is (It\'s) big.' },
  { id:'e28', ch:'f1', t:'mc', p:11, q:'We ____ lazy. (niječno)', a:['aren\'t','isn\'t','am not','haven\'t'], ex:'We are not = We aren\'t.' },
  { id:'e29', ch:'f1', t:'text', p:11, q:'Napiši skraćeni oblik: I am = ?', a:['I\'m','Im','I m'], ex:'I am = I\'m.' },
  { id:'e30', ch:'f1', t:'text', p:11, q:'Napiši skraćeni oblik: She is not = She ____', a:['isn\'t','isnt','is not'], ex:'She is not = She isn\'t.' },
  { id:'e31', ch:'f1', t:'text', p:11, q:'Napiši skraćeni oblik: They are = ?', a:['They\'re','Theyre','They re'], ex:'They are = They\'re.' },
  { id:'e32', ch:'f1', t:'mc', p:11, q:'He ____ got a sister.', a:['has','have','is','are'], ex:'He / She / It → has got. He has got (He\'s got) a sister.' },
  { id:'e33', ch:'f1', t:'mc', p:11, q:'I ____ got a brother.', a:['have','has','am','is'], ex:'I / You / We / They → have got. I have got (I\'ve got) a brother.' },
  { id:'e34', ch:'f1', t:'mc', p:11, q:'It ____ got big ears. (niječno)', a:['hasn\'t','haven\'t','isn\'t','aren\'t'], ex:'It has not got = It hasn\'t got.' },
  { id:'e35', ch:'f1', t:'mc', p:11, q:'They ____ got a house. (niječno)', a:['haven\'t','hasn\'t','aren\'t','isn\'t'], ex:'They have not got = They haven\'t got.' },
  { id:'e36', ch:'f1', t:'text', p:11, q:'Napiši skraćeni oblik: He has not got = He ____ got', a:['hasn\'t','hasnt'], ex:'He has not got = He hasn\'t got.' },
  { id:'e37', ch:'f1', t:'text', p:11, q:'Napiši skraćeni oblik: We have got = ?', a:['We\'ve got','Weve got','We ve got'], ex:'We have got = We\'ve got.' },
  { id:'e38', ch:'f1', t:'mc', p:11, q:'Koja je rečenica točna?', a:['She has got a cat.','She have got a cat.','She is got a cat.','She are got a cat.'], ex:'She → has got.' },
  { id:'e39', ch:'f1', t:'mc', p:11, q:'Koja je rečenica točna?', a:['We are good at sport.','We is good at sport.','We am good at sport.','We has good at sport.'], ex:'We → are.' },

  { id:'e57', ch:'f1', t:'mc', p:10, q:'Who says: „I\'m in the fifth form this year.”?', a:['Mike','Cathy'], ex:'Mike: I am 11 years old and I am in the fifth form this year.' },
  { id:'e58', ch:'f1', t:'mc', p:10, q:'Who says: „My surname is Roberts.”?', a:['Cathy','Mike'], ex:'Cathy: My surname is Roberts.' },
  { id:'e59', ch:'f1', t:'mc', p:10, q:'Who says: „My birthday is in November.”?', a:['Cathy','Mike'], ex:'Cathy is 10, but her birthday is in November, so she is almost 11.' },
  { id:'e5a', ch:'f1', t:'mc', p:10, q:'Who says: „My brother is a real pain in the neck.”?', a:['Mike','Cathy'], ex:'Mike has got a little brother. He is a real pain in the neck.' },
  { id:'e5b', ch:'f1', t:'mc', p:10, q:'Who says: „We have got a pet.”?', a:['Mike','Cathy'], ex:'Mike has got a pet, a parrot called Lilly. Cathy hasn\'t got a pet because her flat is not very big.' },
  { id:'e5c', ch:'f1', t:'mc', p:10, q:'Who says: „I am not an only child.”?', a:['Cathy','Mike'], ex:'Cathy: My family is not so big, but I am not an only child. I\'ve got a big sister, Amy.' },
  { id:'e5d', ch:'f1', t:'mc', p:10, q:'Who says: „Computer games are my hobby.”?', a:['Mike','Cathy'], ex:'Mike is in front of the computer 3 hours a day. His parents are angry.' },
  { id:'e5e', ch:'f1', t:'mc', p:10, q:'Who says: „Dancing is my favourite free-time activity.”?', a:['Cathy','Mike'], ex:'Cathy is a member of a karate club and she is good at dancing, too.' },
  { id:'e5f', ch:'f1', t:'mc', p:10, q:'What is Mike\'s pet?', a:['a parrot called Lilly','a dog called Rex','a cat called Amy','He hasn\'t got a pet.'], ex:'We have also got a pet, a parrot called Lilly.' },
  { id:'e5g', ch:'f1', t:'mc', p:10, q:'What is Cathy and Linda\'s hobby?', a:['They collect stickers.','They play computer games.','They play the piano.','They go skateboarding.'], ex:'We have got the same hobby: we collect stickers. I\'ve got 3 full albums.' },
  { id:'e5h', ch:'f1', t:'text', p:10, q:'What is the name of Cathy\'s big sister?', a:['Amy'], ex:'Amy always sings. She isn\'t bad at singing at all.' },
  { id:'e5i', ch:'f1', t:'mc', p:10, q:'Mike\'s parents call him…', a:['Mikey','Michael','Pete','007'], ex:'My name is Michael, or Mike for short. My parents call me Mikey, but I\'m not a baby.' },
  { id:'e40', ch:'f1', t:'mc', p:12, q:'Who is Linda?', a:['Cathy\'s best friend','Mike\'s sister','Pete\'s cousin','A teacher'], ex:'This is Linda. She is Cathy\'s best friend.' },
  { id:'e41', ch:'f1', t:'mc', p:12, q:'Who is Pete?', a:['Mike\'s best friend','Cathy\'s brother','Linda\'s brother','A new teacher'], ex:'This is Pete. He is Mike\'s best friend.' },
  { id:'e42', ch:'f1', t:'mc', p:12, q:'What instrument does Linda play?', a:['the piano','the guitar','the drums','the violin'], ex:'Linda plays the piano. Her piano classes are three times a week.' },
  { id:'e43', ch:'f1', t:'text', p:12, q:'What is the name of Linda\'s big brother?', a:['Jack'], ex:'Jack is older and he always says: „You girls are stupid!”' },
  { id:'e44', ch:'f1', t:'mc', p:12, q:'Linda shares her room with her brother. What beds have they got?', a:['bunk beds','one big bed','no beds','water beds'], ex:'They have got bunk beds (kreveti na kat). Linda is on the top bed and Jack has got the bottom bed.' },
  { id:'e45', ch:'f1', t:'mc', p:12, q:'What is Linda\'s favourite colour?', a:['blue','pink','red','green'], ex:'Linda is a girl, but her favourite colour isn\'t pink. It is blue.' },
  { id:'e46', ch:'f1', t:'mc', p:12, q:'What is Linda bad at?', a:['sport','dancing','the piano','English'], ex:'She is interested in dancing, but she is really bad at sport. So what!' },
  { id:'e47', ch:'f1', t:'text', p:12, q:'What is Pete\'s full name?', a:['Peter'], ex:'My name is Peter, but all my friends call me Pete.' },
  { id:'e48', ch:'f1', t:'mc', p:12, q:'What is Pete\'s nickname?', a:['007','Inspector J','James','Bond'], ex:'His nickname is 007 because he is crazy about detective and spy stories.' },
  { id:'e49', ch:'f1', t:'mc', p:12, q:'Who is Pete\'s favourite spy?', a:['James Bond','Inspector J','Sherlock Holmes','Mickey Mouse'], ex:'His favourite spy is James Bond. His favourite comic is „Inspector J”.' },
  { id:'e50', ch:'f1', t:'mc', p:12, q:'What belt has Pete got in karate?', a:['a green belt','a black belt','a white belt','a red belt'], ex:'He is a member of a karate club. He has got a green belt already.' },
  { id:'e51', ch:'f1', t:'text', p:12, q:'What is Pete\'s favourite free-time activity?', a:['skateboarding'], ex:'But my favourite free-time activity is skateboarding.' },
  { id:'e52', ch:'f1', t:'mc', p:12, q:'How many cousins in America has Pete got?', a:['two (twins)','one','three','none'], ex:'He has got two cousins in America. They are twins from Los Angeles.' },
  { id:'e53', ch:'f1', t:'mc', p:12, q:'Where is Disneyland?', a:['near Los Angeles','in London','in New York','in Zagreb'], ex:'Disneyland is near Los Angeles. It is an amusement park.' },
  { id:'e54', ch:'f1', t:'match', p:12, q:'Tko je to? Poveži.', pairs:[['Linda','plays the piano'],['Pete','is crazy about spy stories'],['Jack','has got the bottom bed'],['Cathy','is Linda\'s best friend']], ex:'Linda and Pete, str. 12.' },
  { id:'e55', ch:'f1', t:'mc', p:12, q:'Odaberi točno: Linda ____ Cathy\'s best friend.', a:['is','am','are','have got'], ex:'Linda (she) → is.' },
  { id:'e56', ch:'f1', t:'mc', p:12, q:'Odaberi točno: We ____ bunk beds.', a:['have got','has got','are','is'], ex:'We → have got.' },

  { id:'e60', ch:'f2', t:'match', p:14, q:'Poveži predmet s hrvatskim nazivom.', pairs:[['maths','matematika'],['PE','tjelesni (TZK)'],['IT','informatika'],['science','priroda'],['religion','vjeronauk'],['art','likovni']], ex:'School subjects, str. 14.' },
  { id:'e61', ch:'f2', t:'mc', p:14, q:'Što znači PE?', a:['Physical Education','Personal English','Pupils\' Education','Play Every day'], ex:'PE = Physical Education (tjelesni i zdravstveni odgoj).' },
  { id:'e62', ch:'f2', t:'text', p:14, q:'Što znači IT? Information ____', a:['Technology'], ex:'IT = Information Technology (informatika).' },
  { id:'e63', ch:'f2', t:'mc', p:14, q:'In ____ you learn about things and people from the past.', a:['history','geography','science','maths'], ex:'In history you can hear stories about heroes and battles. You must learn some years, too.' },
  { id:'e64', ch:'f2', t:'mc', p:14, q:'In ____ you learn about nature: plants, animals, people.', a:['science','history','IT','PE'], ex:'In science you learn about all living creatures. You can even do some experiments.' },
  { id:'e65', ch:'f2', t:'mc', p:14, q:'In ____ you learn about rivers, lakes, mountains, continents, countries and cities.', a:['geography','history','music','art'], ex:'In geography you need a map and a globe.' },
  { id:'e66', ch:'f2', t:'mc', p:14, q:'In ____ you work with numbers.', a:['maths','IT','music','geography'], ex:'In maths you add, subtract, multiply and divide numbers.' },
  { id:'e67', ch:'f2', t:'mc', p:14, q:'In ____ you learn everything about computers.', a:['IT','maths','science','art'], ex:'In IT you sometimes play games and find interesting things on the Internet.' },
  { id:'e68', ch:'f2', t:'mc', p:14, q:'In ____ you play different sports. You need sneakers.', a:['PE','music','history','religion'], ex:'In PE you are in the gym or in the school playground.' },
  { id:'e69', ch:'f2', t:'match', p:15, q:'Poveži znak s riječi.', pairs:[['+','add'],['−','subtract'],['×','multiply'],['÷','divide']], ex:'Two plus two is four. Four minus three is one. Two times six is twelve. Ten divided by two is five.' },
  { id:'e70', ch:'f2', t:'text', p:14, q:'Two times six is ____ (napiši riječima)', a:['twelve'], ex:'2 × 6 = 12, twelve.' },
  { id:'e71', ch:'f2', t:'text', p:14, q:'Ten divided by two is ____ (napiši riječima)', a:['five'], ex:'10 ÷ 2 = 5, five.' },
  { id:'e72', ch:'f2', t:'match', p:15, q:'Match.', pairs:[['past','the time before now'],['planet','a large body in space (Earth)'],['continent','Africa, Europe'],['chat','a talk with friends'],['plant','a flower, a tree'],['gym','a room where you do sport']], ex:'Vocabulary, str. 15.' },
  { id:'e73', ch:'f2', t:'mc', p:15, q:'Ispravi rečenicu: „In history you work with numbers.”', a:['In maths you work with numbers.','In IT you work with numbers.','In art you work with numbers.','In PE you work with numbers.'], ex:'S brojevima radimo na matematici (maths).' },
  { id:'e74', ch:'f2', t:'mc', p:15, q:'Ispravi rečenicu: „In science you play different sports.”', a:['In PE you play different sports.','In maths you play different sports.','In history you play different sports.','In music you play different sports.'], ex:'Sport je na tjelesnom (PE).' },
  { id:'e75', ch:'f2', t:'mc', p:15, q:'Mike\'s timetable: What is his first lesson on Monday?', a:['maths','history','English','music'], ex:'Mike has got maths first on Monday, Tuesday, Wednesday and Friday.' },
  { id:'e76', ch:'f2', t:'mc', p:15, q:'Mike\'s timetable: What is his first lesson on Thursday?', a:['PE','maths','English','German'], ex:'Thursday starts with PE, Mike\'s favourite subject.' },
  { id:'e77', ch:'f2', t:'mc', p:15, q:'Mike\'s timetable: What is his last lesson on Friday?', a:['geography','religion','maths','music'], ex:'On Friday the last lesson is geography.' },
  { id:'e78', ch:'f2', t:'mc', p:16, q:'Why isn\'t Mike\'s timetable OK?', a:['He has got maths on four days, and he isn\'t good at maths.','He hasn\'t got PE.','He has got no breaks.','He has got history every day.'], ex:'Our first lesson is maths on Monday, maths on Tuesday, maths on Wednesday and maths on Friday.' },
  { id:'e79', ch:'f2', t:'mc', p:16, q:'Who is Mike\'s maths teacher?', a:['Mr Finch','Ms Jones','Ms Pitt','Ms Jason'], ex:'Mr Finch. He is really strict and Mike isn\'t good at maths. He\'s really scared.' },
  { id:'e80', ch:'f2', t:'mc', p:16, q:'What is Mike\'s favourite subject?', a:['PE','maths','history','music'], ex:'The first lesson on Thursday is PE, Mike\'s favourite subject.' },
  { id:'e81', ch:'f2', t:'mc', p:16, q:'Who is Mike\'s form teacher (razrednica)?', a:['Ms Jones','Mr Finch','Ms Pitt','Cathy'], ex:'Ms Jones is great. She is his PE teacher and his form teacher, too.' },
  { id:'e82', ch:'f2', t:'mc', p:16, q:'Who is Mike\'s history teacher?', a:['Ms Pitt','Ms Jones','Mr Finch','Mr Jason'], ex:'Ms Pitt is very nice, but her hair is a bit unusual.' },
  { id:'e83', ch:'f2', t:'mc', p:16, q:'What is unusual about Ms Pitt?', a:['her hair','her car','her voice','her shoes'], ex:'Her hair is a bit unusual. Maybe the colour.' },
  { id:'e84', ch:'f2', t:'mc', p:16, q:'How many new pupils are there in Mike\'s class?', a:['two','three','one','none'], ex:'There are two new pupils. Their father is a writer.' },
  { id:'e85', ch:'f2', t:'mc', p:16, q:'What does the new pupils\' father write?', a:['detective stories','songs','school books','poems'], ex:'Their father is a writer. He writes detective stories.' },
  { id:'e86', ch:'f2', t:'mc', p:16, q:'True or false? Ms Jones is old.', a:['False','True'], ex:'Cathy thinks Ms Jones is wonderful, very pretty and young.' },

  { id:'e89', ch:'f2', t:'mc', p:17, q:'Mr Finch is a strict teacher. ____ tests are difficult.', a:['His','Her','Their','Its'], ex:'Mr Finch = he → his.' },

const EN_ORAL = [
  { id:'eo1', ch:'f1', p:13, q:'Talk about yourself. Reci barem 5 rečenica na engleskom.', pts:['I am … years old.','I\'ve got … / I haven\'t got …','My favourite colour is …','I\'m good at … / I\'m bad at …','I\'m interested in … / I\'m crazy about …'] },
  { id:'eo2', ch:'f1', p:13, q:'Talk about your best friend.', pts:['My best friend is …','He / She is … years old.','He / She has got …','He / She is good at …','His / Her favourite … is …'] },
  { id:'eo3', ch:'f1', p:12, q:'Prepričaj: Linda and Pete (str. 12)', pts:['Linda is Cathy\'s best friend. She plays the piano.','Linda shares her room with her brother Jack.','Her favourite colour is blue. She is interested in dancing.','Pete is Mike\'s best friend. His nickname is 007.','Pete is crazy about detective and spy stories. He is in a karate club.','His favourite free-time activity is skateboarding.'],
    model:'This is Linda. She is Cathy\'s best friend. They are in the same class, but they aren\'t neighbours. Linda plays the piano three times a week. She shares her room with her brother Jack. They have got bunk beds. Jack is older and Linda thinks he is in love with Lizzy. Her favourite colour isn\'t pink. It is blue. She is interested in dancing, but she is really bad at sport. This is Pete. He is Mike\'s best friend. His name is Peter, but his friends call him Pete. His nickname is 007 because he is crazy about detective and spy stories. His favourite spy is James Bond. Like a real detective, Pete is a member of a karate club. He has got a green belt. But his favourite free-time activity is skateboarding. Pete has got two cousins in America. They are twins from Los Angeles.' },
  { id:'eo5', ch:'f1', p:10, q:'Prepričaj: Cathy and Mike (str. 10)', pts:['They are neighbours and very good friends, but not in the same class.','Mike is 11, in the fifth form. He has got a big family and a parrot called Lilly.','Computer games are Mike\'s hobby. His best friend is Pete.','Cathy Roberts is 10. She has got a big sister, Amy, and a lot of cuddly animals.','Cathy\'s best friend is Linda. They collect stickers. Cathy loves dancing.'],
    model:'Cathy and Mike are neighbours. They are very good friends, but they are not in the same class. Every day they go to school together. Mike is eleven years old and he is in the fifth form. He has got a big family: a mum, a dad, a big sister and a little brother. They have got a parrot called Lilly. Computer games are his hobby. His best friend is Pete. Cathy\'s surname is Roberts. She is ten. She has got a big sister, Amy. She hasn\'t got a pet, but she has got a lot of cuddly animals. Her best friend is Linda. They collect stickers. Cathy is good at dancing.' },
  { id:'eo6', ch:'f2', p:17, q:'Talk about your school: subjects and teachers.', pts:['I have got … subjects.','My timetable is …','My favourite subject is …','I am good at … but I am bad at …','My form teacher is …'] },
  { id:'eo7', ch:'f2', p:16, q:'Prepričaj: Mike\'s first week at school (str. 16)', model:'It is the first week of school. Mike and Cathy have got a lot of new teachers and new subjects. Mike says everything is fine, but his timetable is horrible. He has got maths on Monday, Tuesday, Wednesday and Friday. His maths teacher is Mr Finch. He is really strict and Mike isn\'t good at maths, so he is scared. On Thursday his first lesson is PE. That is his favourite subject. Ms Jones is his PE teacher and his form teacher, too. She is great. His history teacher is Ms Pitt. She is very nice, but her hair is a bit unusual. There are two new pupils in Mike\'s class. Their father is a writer. He writes detective stories.', pts:['His timetable is horrible: maths on four days.','Mr Finch is his maths teacher. He is strict.','His favourite subject is PE.','Ms Jones is his PE teacher and form teacher.','Ms Pitt is his history teacher. Her hair is unusual.','There are two new pupils. Their father is a writer.'] },

    const pct = Math.round(100 * ok / qs.length), g = gradeFor(pct);
    qs.forEach((q, k) => record(q.id, !!(answers[k] && answers[k].ok)));
    S.pts += ok * 10 + 5; S.rounds++; lg().ex++; S.exams.push({ d: DAY(), pct, g }); bumpStreak();
    const nb = checkBadges(); save();
    clear();
    setTimeout(() => { beep(g >= 3 ? 'win' : 'tap'); if (g >= 4) confetti($app.querySelector('.mark'), 70); }, 300);
    $app.append(
      h('section', { class: 'card' },
        h('p', { class: 'eyebrow' }, 'Probni ispit · rezultat'),
        buddy(g >= 4 ? 'cheer' : g >= 2 ? 'wave' : 'sad', g >= 4 ? 'Wow, ocjena ' + g + '! Spreman/na si za ispit.' : g >= 2 ? 'Nije loše! Još malo vježbe i bit će još bolje.' : 'Ne odustaj! Vježbajmo pogreške zajedno.', 90),
        h('div', { class: 'grade' }, h('div', { class: 'mark pop' }, String(g)),
          h('div', null, h('h2', null, GRADE_NAMES[g]), h('p', null, ok + ' od ' + qs.length + ' točno (' + pct + ' %)'), h('p', { class: 'small muted' }, '+' + (ok * 10 + 5) + ' bodova'))),
        nb.length ? h('div', { class: 'feedback ok' }, h('h3', null, 'Nova značka!'), h('p', null, nb.join(', '))) : null,
        h('p', { class: 'small muted' }, 'Pogrešna pitanja automatski dolaze u sljedeće vježbe.'),
        h('div', { class: 'row' }, h('button', { class: 'btn', type: 'button', onclick: startPractice }, 'Vježbaj pogreške'), h('button', { class: 'btn ghost', type: 'button', onclick: toHome }, 'Na početak'))
      ),
      h('section', { class: 'card' }, h('h2', null, 'Pregled odgovora'),
        h('div', { class: 'review' }, qs.map((q, k) => {
          const a = answers[k], good = !!(a && a.ok);
          return h('div', { class: 'rv' }, h('span', { class: 'm ' + (good ? 'ok' : 'bad') }, good ? '✓' : '✗'),
            h('div', null, h('p', null, h('b', null, q.q)),
              good ? null : h('p', { class: 'small' }, 'Tvoj odgovor: ' + (a ? a.given : '(bez odgovora)')),
              good ? null : h('p', { class: 'small' }, 'Točno: ' + correctText(q)),
              h('p', { class: 'src' }, SRC(q.p))));
        })))
    );
  }
  show();
}

hub();
</script>
